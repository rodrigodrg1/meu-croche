<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9a5c70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Meu Crochê — Contador de Carreiras</title>
<style>
:root{
  --bg:#f7f3f0; --card:#fff; --text:#2f2926; --muted:#7a6f69; --line:#e8dfda;
  --accent:#9a5c70; --accent2:#ead6dd; --ok:#5f8d72; --danger:#b65d5d;
  --shadow:0 8px 30px rgba(62,42,35,.08); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{position:relative;background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:22px;margin:4px 8px 24px}
.brand span{color:var(--accent)}
.nav button{display:flex;width:100%;padding:12px 14px;margin:5px 0;border-radius:12px;background:transparent;text-align:left;color:var(--text)}
.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}
.side-bottom{position:absolute;bottom:18px;left:16px;right:16px}
main{padding:28px;max-width:1400px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}
h1{font-size:30px;margin:0 0 5px}.subtitle{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}
.btn{background:var(--accent);color:white;padding:11px 16px;border-radius:12px;font-weight:700}
.btn.secondary{background:#f0e9e5;color:var(--text)} .btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:#f6dddd;color:var(--danger)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--text)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.kpi{font-size:42px;font-weight:800;line-height:1;margin:8px 0}
.small{font-size:13px;color:var(--muted)}
.progress{height:12px;background:#eee5e1;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:.2s;width:0}
.counter{display:flex;align-items:center;justify-content:space-between;gap:16px}
.counter-main{text-align:center;flex:1}
.counter-value{font-size:78px;font-weight:850;line-height:1}
.counter-label{color:var(--muted);font-weight:700}
.circle-btn{width:64px;height:64px;border-radius:50%;font-size:30px;background:#f0e9e5;color:var(--text)}
.circle-btn.plus{background:var(--accent);color:white}
.section-item,.session-item{padding:12px 0;border-bottom:1px solid var(--line)}
.section-item:last-child,.session-item:last-child{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:700}
.pattern-wrap{position:relative;overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:14px;background:#fafafa}
.pattern-stage{position:relative;display:inline-block;min-width:100%;line-height:0}
.pattern-stage canvas{display:block;max-width:none}
.pattern-stage img{display:block;max-width:100%;height:auto}
.row-highlight{position:absolute;left:0;right:0;display:none;background:rgba(24,119,242,.22);border-top:2px solid #1877f2;border-bottom:2px solid #1877f2;box-shadow:0 0 0 1px rgba(24,119,242,.12) inset;pointer-events:none;z-index:5;transition:top .16s ease,height .16s ease}
.row-highlight-label{position:absolute;left:0;top:50%;transform:translateY(-50%);background:#1877f2;color:#fff;padding:4px 9px;border-radius:0 7px 7px 0;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hidden{display:none!important}
.project-card{cursor:pointer;transition:.15s}.project-card:hover{transform:translateY(-2px)}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
.toast{position:fixed;right:22px;bottom:22px;background:#2f2926;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:50}
.modal{position:fixed;inset:0;background:rgba(30,20,16,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal-box{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.shortcut{display:inline-flex;min-width:26px;justify-content:center;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:#faf7f5;font-size:12px}
.dark{--bg:#171414;--card:#211d1b;--text:#f5efeb;--muted:#b7aaa4;--line:#382f2b;--accent:#d4879e;--accent2:#3d2930;--shadow:0 8px 30px rgba(0,0,0,.22)}
.dark input,.dark select,.dark textarea{background:#191615;color:var(--text);border-color:var(--line)}
.dark aside{position:relative;background:#211d1b;border-color:var(--line)}
.dark .btn.secondary{background:#352d2a;color:var(--text)}
.dark .circle-btn{background:#352d2a;color:var(--text)}
.dark .progress{background:#382f2b}

/* V6 */
body.work-mode main{max-width:none;padding:16px 18px}body.work-mode #page-work>.top{margin-bottom:12px}.work-shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:start}.work-rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}.compact-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.compact-card h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.mini-counter{text-align:center;padding:4px 0 10px}.mini-counter strong{font-size:40px;line-height:1}.mini-counter span{color:var(--muted);font-weight:700}.nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav-grid .btn{padding:9px 4px;border-radius:9px}.jump-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.jump-row .btn{padding:9px 12px}.mark-action{width:100%;margin-top:7px}.color-row{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}.color-row input[type=color]{height:38px;padding:2px;border-radius:9px}.switch-row{display:flex;gap:8px;align-items:center;font-size:13px}.switch-row input{width:auto}.direction-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.direction-grid .btn{padding:9px 6px;font-size:12px}.viewer-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.viewer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.viewer-file{font-size:13px;font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}.viewer-actions{display:flex;gap:6px;align-items:center}.viewer-actions .btn{padding:8px 10px;border-radius:9px;font-size:12px}.viewer-card .pattern-wrap{max-height:none;height:calc(100vh - 215px);min-height:540px;border:0;border-radius:0;background:#fafafa}.viewer-card .pattern-stage{min-width:100%}.viewer-card .pattern-stage img{max-width:none}.viewer-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}.detect-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.detect-inline .btn{padding:8px 11px;font-size:12px}.row-highlight{z-index:8}.completed-rows-layer{position:absolute;inset:0;pointer-events:none;z-index:6}.completed-row-band{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(0,0,0,.08)}.completed-row-label{position:absolute;left:0;top:50%;transform:translateY(-50%);padding:2px 6px;border-radius:0 5px 5px 0;color:white;font-size:10px;font-weight:800;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.45)}.completed-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.extra-tools{grid-column:1/-1;margin-top:12px}.extra-tools details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.extra-tools summary{cursor:pointer;font-weight:750}.extra-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.viewer-card:fullscreen{background:var(--bg)}.viewer-card:fullscreen .pattern-wrap{height:calc(100vh - 104px);min-height:0}.viewer-card:fullscreen .viewer-toolbar,.viewer-card:fullscreen .viewer-footer{background:var(--card)}body.viewer-focus .app{grid-template-columns:1fr}body.viewer-focus aside{display:none}body.viewer-focus main{max-width:none;padding:8px}body.viewer-focus #page-work>.top{display:none}body.viewer-focus .work-shell{grid-template-columns:minmax(0,1fr)}body.viewer-focus .viewer-card .pattern-wrap{height:calc(100vh - 105px);min-height:0}@media(max-width:1100px){.work-shell{grid-template-columns:220px minmax(0,1fr)}.viewer-card .pattern-wrap{height:70vh;min-height:480px}}@media(max-width:760px){.work-shell{grid-template-columns:1fr}.work-rail{position:static;max-height:none}.viewer-card .pattern-wrap{height:65vh;min-height:420px}.extra-grid{grid-template-columns:1fr}.viewer-file{max-width:100%}}
@media(max-width:900px){
 .app{grid-template-columns:1fr} aside{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}
 .side-bottom{position:static;margin-top:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}
 main{padding:18px}.span8,.span6,.span4,.span3{grid-column:span 12}
}

.sidebar-toggle{
  position:absolute; top:18px; right:12px; width:34px; height:34px; border-radius:10px;
  background:var(--accent2); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-weight:800; z-index:5;
}
.app.sidebar-collapsed{grid-template-columns:78px 1fr}
.app.sidebar-collapsed aside{padding:18px 10px}
.app.sidebar-collapsed .brand{font-size:0;margin:4px 0 24px;text-align:center}
.app.sidebar-collapsed .brand:before{content:"🧶";font-size:24px}
.app.sidebar-collapsed .nav button{font-size:0;justify-content:center;padding:12px 8px}
.app.sidebar-collapsed .nav button{overflow:hidden}
.app.sidebar-collapsed .nav button[data-icon]::before{content:attr(data-icon);font-size:20px}
.app.sidebar-collapsed .side-bottom .btn{font-size:0}
.app.sidebar-collapsed .side-bottom .btn:before{content:"🌙";font-size:20px}
.app.sidebar-collapsed .side-bottom .small{display:none}
.app.sidebar-collapsed .sidebar-toggle{right:50%;transform:translateX(50%)}
@media(max-width:900px){
 .app.sidebar-collapsed{grid-template-columns:1fr}
 .app.sidebar-collapsed aside{padding:12px}
 .app.sidebar-collapsed .brand{display:none}
 .app.sidebar-collapsed .nav{display:flex}
}


.marker,.completed-overlay{transition:top .12s ease,height .12s ease,background-color .12s ease}

button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pdfPatternWrap{scroll-behavior:auto;overflow-anchor:none}
.pattern-wrap{overflow-anchor:none}


/* V6.3 — zoom, pontos e overlays estáveis */
.zoom-readout{min-width:54px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.point-marks-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:10}
.point-mark{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
.pattern-stage.point-mode{cursor:crosshair}
.pattern-stage.point-mode canvas,.pattern-stage.point-mode img{cursor:crosshair}
.viewer-actions{flex-wrap:wrap}.viewer-toolbar{align-items:flex-start}
.btn.active-tool{box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent2);color:var(--accent)}
.voice-state{font-size:12px;color:var(--muted);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detect-number{width:82px!important;padding:7px!important}
.pattern-stage{vertical-align:top}
/* V7.1 — centralização horizontal puramente visual.
   Não altera canvas/imagem, coordenadas da grade, overlays ou pontos. */
.pattern-wrap.horizontal-centered .pattern-stage{
  display:block;
  width:max-content;
  min-width:0;
  margin-left:auto;
  margin-right:auto;
}


/* V7.3 — contagem horizontal por carreira (sem alterar a geometria vertical) */
.point-counter-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.point-counter-grid .btn{padding:9px 6px}
.point-active-layer{position:absolute;inset:0;pointer-events:none;z-index:9}
.point-active-cell{position:absolute;display:none;border:2px solid #ff8a00;background:rgba(255,138,0,.18);box-shadow:0 0 0 1px rgba(255,255,255,.75) inset;pointer-events:none}
.point-active-label{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);background:#ff8a00;color:#fff;padding:2px 6px;border-radius:6px 6px 0 0;font-size:10px;font-weight:800;line-height:1.2;white-space:nowrap}
/* V7.4 — a etiqueta da carreira não ocupa nenhuma coluna da régua. */
.row-highlight-label{display:none!important}
.pattern-stage.point-ruler-enabled{padding-bottom:30px}
.point-ruler-layer{position:absolute;left:0;height:30px;pointer-events:none;z-index:12;overflow:visible}
.point-ruler-cell{position:absolute;top:0;height:28px;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(24,119,242,.45);border-right:1px solid rgba(24,119,242,.20);border-bottom:1px solid rgba(24,119,242,.45);background:rgba(255,255,255,.94);color:#1769c2;font-size:10px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden}
.point-ruler-cell.active{background:rgba(255,138,0,.16);border:2px solid #ff8a00;color:#b95d00;z-index:2}
.dark .point-ruler-cell{background:rgba(30,27,26,.96);color:#8ec1ff}
.dark .point-ruler-cell.active{background:rgba(255,138,0,.20);color:#ffb45c}
.metric-box{margin-top:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(127,127,127,.04)}
.metric-box strong{display:block;font-size:18px;margin-top:2px}


/* ================= V7.5 — RÉGUAS EXTERNAS / CANVAS LIMPO =================
   As réguas vivem FORA do pattern-stage. Nada nelas altera coordenadas da grade.
   Dentro do gráfico permanecem apenas overlays leves: carreira, concluídas, pontos e célula ativa. */
.pattern-shell-v75{
  --row-ruler-w:52px;
  --point-ruler-h:30px;
  position:relative;
  display:inline-block;
  width:max-content;
  padding-left:var(--row-ruler-w);
  padding-bottom:var(--point-ruler-h);
  line-height:0;
  vertical-align:top;
}
.pattern-shell-v75 .pattern-stage{
  display:inline-block;
  min-width:0!important;
  margin:0!important;
  padding:0!important;
  vertical-align:top;
}
.pattern-shell-v75 .pattern-stage canvas,
.pattern-shell-v75 .pattern-stage img{display:block;max-width:none}
.row-ruler-external-v75{
  position:absolute;left:0;top:0;width:48px;height:0;
  pointer-events:none;z-index:15;overflow:visible;
}
.row-ruler-cell-v75{
  position:absolute;right:4px;width:42px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:5px;border-bottom:1px solid rgba(24,119,242,.22);
  color:var(--muted);font-size:9px;font-weight:750;line-height:1;overflow:hidden;white-space:nowrap;
}
.row-ruler-cell-v75.active{
  background:rgba(24,119,242,.12);color:#1877f2;border-right:3px solid #1877f2;font-weight:900;
}
.point-ruler-external-v75{
  position:absolute;left:var(--row-ruler-w);height:30px;
  pointer-events:none;z-index:15;overflow:visible;
}
.point-ruler-external-v75 .point-ruler-cell{
  top:0;height:28px;background:var(--card);border-top:1px solid rgba(24,119,242,.28);
  border-bottom:1px solid rgba(24,119,242,.38);color:#1769c2;
}
.point-ruler-external-v75 .point-ruler-cell.active{
  background:rgba(255,138,0,.12);border:2px solid #ff8a00;color:#b95d00;
}
/* Zero tags/textos internos sobre o desenho. */
.row-highlight-label,.completed-row-label,.point-active-label{display:none!important}
.pattern-stage.point-ruler-enabled{padding-bottom:0!important}
.point-active-cell{background:rgba(255,138,0,.06)!important;border:2px solid #ff8a00!important;box-shadow:none!important}
.row-highlight{background:rgba(24,119,242,.14)!important}
/* Centralização da V7.5 move o conjunto imagem+réguas; não toca no eixo lógico. */
.pattern-wrap.horizontal-centered .pattern-stage{margin:0!important}
.pattern-wrap.horizontal-centered .pattern-shell-v75{
  display:block;width:max-content;min-width:0;margin-left:auto;margin-right:auto;
}
.dark .point-ruler-external-v75 .point-ruler-cell{background:var(--card);color:#8ec1ff}
.dark .row-ruler-cell-v75.active{background:rgba(24,119,242,.22);color:#9bc9ff}

/* =====================================================================
   V7.6.7 APP MOBILE ESTÁVEL
   Apenas apresentação/responsividade. A lógica V7.6.7 permanece intacta.
   ===================================================================== */
@media(max-width:760px){
  html,body{min-height:100%;overscroll-behavior-y:none}
  body{padding:0 0 calc(72px + env(safe-area-inset-bottom));}
  .app{display:block!important;min-height:100dvh}

  /* Barra inferior estilo aplicativo */
  .app>aside{
    position:fixed!important;
    left:0!important; right:0!important; bottom:0!important; top:auto!important;
    height:64px!important;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))!important;
    background:var(--card)!important;
    border:0!important;
    border-top:1px solid var(--line)!important;
    box-shadow:0 -8px 28px rgba(0,0,0,.10);
    z-index:300!important;
  }
  .app>aside .brand,
  .app>aside .sidebar-toggle,
  .app>aside .side-bottom{display:none!important}
  .app>aside .nav{
    height:100%;
    display:grid!important;
    grid-template-columns:repeat(3,1fr)!important;
    gap:6px!important;
    overflow:visible!important;
  }
  .app>aside .nav button{
    margin:0!important;
    padding:6px 3px!important;
    min-height:48px;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    text-align:center!important;
    border-radius:12px!important;
    font-size:11px!important;
    line-height:1.15!important;
    white-space:nowrap!important;
  }

  main{
    width:100%!important;
    max-width:none!important;
    margin:0!important;
    padding:10px 10px 8px!important;
  }

  /* Cabeçalho compacto */
  .top{margin-bottom:10px!important;gap:8px!important;align-items:flex-start!important}
  h1{font-size:22px!important;line-height:1.15!important}
  .subtitle{font-size:12px!important;line-height:1.3}
  #page-work>.top>.row{gap:5px!important;justify-content:flex-end}
  #page-work>.top>.row .btn,
  #page-work>.top>.row label.btn{padding:8px 9px!important;font-size:11px!important}

  /* Home */
  .grid{gap:10px!important}
  .project-card{grid-column:span 12!important;padding:14px!important;border-radius:14px!important}
  .project-card h2{font-size:18px;margin:10px 0 7px}
  .card{padding:14px!important}
  .formgrid{grid-template-columns:1fr!important;gap:10px!important}

  /* Novo projeto como painel inferior, acima da navegação */
  .modal{
    z-index:1000!important;
    align-items:flex-end!important;
    padding:0!important;
  }
  .modal-box{
    width:100%!important;
    max-width:none!important;
    max-height:92dvh!important;
    overflow:auto!important;
    border-radius:22px 22px 0 0!important;
    padding:18px 16px calc(22px + env(safe-area-inset-bottom))!important;
  }
  .modal-box .top{position:sticky;top:0;background:var(--card);z-index:2;padding-bottom:5px}
  .modal-box .row:last-child{
    position:sticky;
    bottom:0;
    background:var(--card);
    padding-top:10px;
  }
  .modal-box .row:last-child .btn{min-height:44px}

  /* Área de trabalho: controles essenciais -> gráfico -> demais opções */
  .work-shell{
    display:grid!important;
    grid-template-columns:1fr!important;
    gap:9px!important;
  }
  .work-rail{
    display:contents!important;
    position:static!important;
    max-height:none!important;
    overflow:visible!important;
  }
  .work-rail>.compact-card{grid-column:1!important;margin:0!important}

<body>
<div class="app" id="appRoot">
<aside><button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" title="Recolher/expandir lateral">☰</button>
  <div class="brand">🧶 Meu <span>Crochê</span></div>
  <div class="nav">
    <button data-icon="🏠" id="nav-home" class="active" onclick="showPage('home')">🏠 Projetos</button>
    <button data-icon="🧵" id="nav-work" onclick="showPage('work')">🧵 Projeto atual</button>
    <button data-icon="🛠️" id="nav-tools" onclick="showPage('tools')">🛠️ Ferramentas</button>
  </div>
  <div class="side-bottom">
    <button class="btn secondary" style="width:100%" onclick="toggleDark()">🌙 Aparência</button>
    <div class="small" style="margin:10px 5px">Tudo fica salvo neste navegador.<br>Versão 7.6.7 APP · foco crochê</div>
  </div>
</aside>

<main>
<section id="page-home">
  <div class="top">
    <div><h1>Meus projetos</h1><div class="subtitle">Organize carreiras, tempo e partes sem se perder.</div></div>
    <button class="btn" onclick="openProjectModal()">＋ Novo projeto</button>
  </div>
  <div id="project-list" class="grid"></div>
</section>

<section id="page-work" class="hidden">
  <div class="top">
    <div><h1 id="work-title">Projeto</h1><div id="work-subtitle" class="subtitle"></div></div>
    <div class="row">
      <button class="btn secondary" onclick="showPage('home')">← Projetos</button>
      <button class="btn secondary" onclick="exportData()">💾 Backup</button><label class="btn secondary" style="cursor:pointer">📥 Restaurar<input type="file" accept="application/json,.json" hidden onchange="importBackup(this)"></label>
    </div>
  </div>
  <div id="work-content"></div>
</section>

<section id="page-tools" class="hidden">
  <div class="top"><div><h1>Ferramentas</h1><div class="subtitle">Pequenos cálculos para facilitar o trabalho.</div></div></div>
  <div class="grid">
    <div class="card span4">
      <h3>📏 Regra de três</h3>
      <div class="formgrid">
        <div><label>A</label><input id="calcA" type="number" value="10"></div>
        <div><label>B</label><input id="calcB" type="number" value="20"></div>
        <div><label>C</label><input id="calcC" type="number" value="5"></div>
        <div><label>Resultado</label><input id="calcD" readonly></div>
      </div>
      <button class="btn" style="margin-top:12px" onclick="rule3()">Calcular</button>
    </div>
    <div class="card span4">
      <h3>🧶 Conversor de unidades</h3>
      <div><label>Centímetros → metros</label><input id="cm" type="number" oninput="document.getElementById('m').value=(Number(this.value||0)/100).toFixed(2)"></div>
      <div style="margin-top:10px"><label>Metros</label><input id="m" readonly></div>
    </div>
    <div class="card span4">
      <h3>⏱️ Estimativa de tempo</h3>
      <div><label>Carreiras restantes</label><input id="etRows" type="number" value="20"></div>
      <div><label>Minutos por carreira</label><input id="etMin" type="number" value="5"></div>
      <button class="btn" style="margin-top:12px" onclick="estimate()">Estimar</button>
      <div id="etOut" class="kpi" style="font-size:30px"></div>
    </div>
  </div>
</section>
</main>

<div id="modal" class="modal hidden">
 <div class="modal-box">
   <div class="top"><h2 style="margin:0">Novo projeto</h2><button class="btn secondary" onclick="closeModal()">✕</button></div>
   <div class="formgrid">
     <div><label>Nome do projeto</label><input id="pName" placeholder="Ex.: Toalha de mesa"></div>
     <div><label>Tipo</label><select id="pType"><option>Filé crochê</option><option>Crochê</option><option>Tricô</option><option>Outro</option></select></div>
     <div><label>Total de carreiras</label><input id="pRows" type="number" min="0" value="0"></div>
     <div><label>Meta de pontos por carreira (opcional)</label><input id="pStitches" type="number" min="0" value="0"></div>
   </div>
   <div style="margin-top:14px"><label>Observações</label><textarea id="pNotes" placeholder="Fio, agulha, tamanho, observações..."></textarea></div>
   <div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="createProject()">Criar projeto</button></div>
 </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const KEY='meuCrocheApp_v1';
const HGRID_SCHEMA=5;
let data; try{data=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"dark":false}')}catch(e){data={projects:[],dark:false}};
let currentId=null, timerHandle=null, voiceRecognition=null;
let pdfPageCache={};
let detectedGridCache={};

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function applySidebarState(){
 const app=document.getElementById('appRoot');
 const btn=document.getElementById('sidebarToggle');
 if(!app)return;
 app.classList.toggle('sidebar-collapsed',!!data.sidebarCollapsed);
 if(btn)btn.textContent=data.sidebarCollapsed?'→':'☰';
}
function toggleSidebar(){
 data.sidebarCollapsed=!data.sidebarCollapsed;
 save();
 applySidebarState();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function showPage(p){
 ['home','work','tools'].forEach(x=>document.getElementById('page-'+x).classList.toggle('hidden',x!==p));
 ['home','work','tools'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',x===p));
 document.body.classList.toggle('work-mode',p==='work');
 if(p==='home') renderProjects(); if(p==='work') renderWork();
}
function toggleDark(){data.dark=!data.dark;document.body.classList.toggle('dark',data.dark);save()}
document.body.classList.toggle('dark',!!data.dark);

function openProjectModal(){document.getElementById('modal').classList.remove('hidden');setTimeout(()=>document.getElementById('pName').focus(),50)}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function createProject(){
 const name=document.getElementById('pName').value.trim()||'Projeto sem nome';
 const rows=Number(document.getElementById('pRows').value)||0;
 const stitches=Number(document.getElementById('pStitches').value)||0;
 const p={id:uid(),name,type:document.getElementById('pType').value,totalRows:rows,row:0,totalStitches:stitches,stitches:0,
   notes:document.getElementById('pNotes').value,direction:'bottom-up',completedRows:{},completedColor:'#2cab5f',autoMarkCompleted:true,currentRowColor:'#1877f2',seconds:0,running:false,lastStart:null,sessions:[],sections:[],
   counters:[{id:uid(),name:'Carreiras',value:0,target:rows,step:1,autoEvery:0,autoTarget:0},
             {id:uid(),name:'Pontos',value:0,target:stitches,step:1,autoEvery:0,autoTarget:0}],
   reminders:[],pattern:null,created:new Date().toISOString()};
 data.projects.unshift(p);save();closeModal();currentId=p.id;showPage('work');toast('Projeto criado!')}
function project(){return normalizeProject(data.projects.find(p=>p.id===currentId))}
function normalizeProject(p){
 if(!p)return p;
 if(!Array.isArray(p.completedRows))p.completedRows=[];
 if(typeof p.autoCompletePrevious!=='boolean')p.autoCompletePrevious=true;
 if(!p.completedColor)p.completedColor='#2fb36f';
 if(!p.direction)p.direction='bottom-up';
 if(!Array.isArray(p.counters))p.counters=[];
 if(!Array.isArray(p.reminders))p.reminders=[];
 if(!Array.isArray(p.sections))p.sections=[];
 return p;
}

function getDirection(p){
 if(!p.direction) p.direction='bottom-up';
 return p.direction;
}
function ensureProjectUiState(p){if(!p)return;if(!p.completedRows||Array.isArray(p.completedRows))p.completedRows={};if(!p.completedColor)p.completedColor='#2cab5f';if(typeof p.autoMarkCompleted!=='boolean')p.autoMarkCompleted=true;if(!p.currentRowColor)p.currentRowColor='#1877f2';}
function completedCount(p){ensureProjectUiState(p);return Object.keys(p.completedRows).filter(k=>p.completedRows[k]).length}
function setCompletedColor(color){const p=project();if(!p)return;ensureProjectUiState(p);p.completedColor=color||'#2cab5f';save();renderCompletedRows()}
function recolorCompleted(){const p=project();if(!p)return;ensureProjectUiState(p);Object.keys(p.completedRows).forEach(k=>p.completedRows[k]=p.completedColor);save();renderCompletedRows();toast('Cor aplicada às carreiras concluídas')}
function setAutoMarkCompleted(v){const p=project();if(!p)return;ensureProjectUiState(p);p.autoMarkCompleted=!!v;save()}
function toggleCompletedRow(row){const p=project();if(!p)return;ensureProjectUiState(p);row=Math.max(1,Math.min(Number(p.totalRows||row),Number(row)||1));const key=String(row);if(p.completedRows[key])delete p.completedRows[key];else p.completedRows[key]=p.completedColor;save();renderWork();toast(p.completedRows[key]?'Carreira '+row+' concluída':'Carreira '+row+' reaberta')}
function markThroughCurrent(){const p=project();if(!p)return;ensureProjectUiState(p);const end=Math.max(0,Number(p.row)||0);for(let r=1;r<=end;r++)p.completedRows[String(r)]=p.completedRows[String(r)]||p.completedColor;save();renderWork();toast('Carreiras 1–'+end+' marcadas como concluídas')}
function clearCompleted(){const p=project();if(!p||!confirm('Remover todas as marcações de concluído?'))return;ensureProjectUiState(p);p.completedRows={};save();rerenderPreserveViewer()}

function setDirection(dir){
 const p=project(); if(!p)return;
 p.direction=dir==='top-down'?'top-down':'bottom-up';
 p.activePoint=1;
 save(); rerenderPreserveViewer();
 toast(p.direction==='bottom-up'?'Carreiras: de baixo para cima':'Carreiras: de cima para baixo');
}

function renderProjects(){
 const el=document.getElementById('project-list');
 if(!data.projects.length){el.innerHTML='<div class="card span12 empty"><div style="font-size:48px">🧶</div><h2>Nenhum projeto ainda</h2><p>Crie seu primeiro projeto e nunca mais perca a carreira.</p><button class="btn" onclick="openProjectModal()">＋ Criar projeto</button></div>';return}
 el.innerHTML=data.projects.map(p=>{
   const pct=p.totalRows?Math.min(100,p.row/p.totalRows*100):0;
   return `<div class="card project-card span4" onclick="currentId='${p.id}';showPage('work')">
    <div class="row" style="justify-content:space-between"><span class="badge">${esc(p.type)}</span><span class="small">${Math.round(pct)}%</span></div>
    <h2>${esc(p.name)}</h2>
    <div class="small">Carreira ${p.row}${p.totalRows?' de '+p.totalRows:''}</div>
    <div class="progress" style="margin-top:12px"><div style="width:${pct}%"></div></div>
    <div class="small" style="margin-top:10px">⏱️ ${formatTime(p.seconds)} · 🧵 ${p.stitches} pontos</div>
   </div>`}).join('');
}
function formatTime(s){s=Math.max(0,Math.floor(s||0));let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(sec).padStart(2,'0')}s`:`${sec}s`}
function addTime(p){
 if(!p.running)return;
 const now=Date.now(), diff=Math.floor((now-p.lastStart)/1000);p.seconds+=Math.max(0,diff);p.lastStart=now;
}
function startTimer(){let p=project();if(!p)return;p.running=true;p.lastStart=Date.now();save();renderWork();clearInterval(timerHandle);timerHandle=setInterval(()=>{addTime(p);updateLive();},1000);toast('Cronômetro iniciado')}
function pauseTimer(){let p=project();if(!p)return;addTime(p);p.running=false;p.sessions.push({at:new Date().toISOString(),seconds:Math.floor((p.lastStart?0:0)+0)});save();clearInterval(timerHandle);renderWork();toast('Cronômetro pausado')}
function resetTimer(){let p=project();if(!p)return;if(!confirm('Zerar o tempo deste projeto?'))return;p.seconds=0;p.running=false;p.lastStart=null;p.sessions=[];save();clearInterval(timerHandle);renderWork()}
function updateLive(){const p=project();if(!p)return;addTime(p);const e=document.getElementById('liveTime');if(e)e.textContent=formatTime(p.seconds);const speed=document.getElementById('speed');if(speed&&p.row) speed.textContent=(p.seconds/60/p.row).toFixed(1)+' min/carreira';save()}

function rerenderPreserveViewer(){
 const pos=captureViewerScroll();
 renderWork();
 requestAnimationFrame(()=>restoreViewerScroll(pos));

function captureViewerScroll(){

 // Auto-complete the row being left when advancing, if enabled.

   if(!Array.isArray(p.completedRows))p.completedRows=[];

   }
 }

 p.row=next;

function dataUrlToUint8Array(dataUrl){
 const comma=dataUrl.indexOf(',');
 if(comma<0)throw new Error('Arquivo PDF inválido');
 const meta=dataUrl.slice(0,comma), body=dataUrl.slice(comma+1);
 if(meta.includes(';base64')){
   const bin=atob(body), out=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
   return out;
 }
 return new TextEncoder().encode(decodeURIComponent(body));
}

async function loadPdfDocument(p){
 if(!window.pdfjsLib){
   throw new Error('Leitor de PDF não carregou. Verifique sua conexão com a internet e reabra o site.');

 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const bytes=dataUrlToUint8Array(p.pattern.data);
 return pdfjsLib.getDocument({data:bytes}).promise;
}

function positionPatternMarker(){

 const canvas=document.getElementById('pdfCanvas');
 if(!p||!m)return;

 const total=Math.max(1,Number(p.totalRows||p.detectedRows||1));
 const row=Math.min(total,Math.max(1,Number(p.row||1)));
 const dir=getDirection(p);

 // If exact grid coordinates were detected, use them.
 const det=p.gridDetection || p.detectedGrid || null;
 let topPct, heightPct;

 if(det && Array.isArray(det.lines) && det.lines.length>=2){
   const lines=det.lines;
   const cells=Math.max(1,lines.length-1);
   const idx=Math.min(cells-1,Math.max(0,row-1));
   let y1,y2;
   if(dir==='bottom-up'){
     const revIdx=cells-1-idx;
     y1=lines[revIdx];
     y2=lines[revIdx+1];
   }else{
     y1=lines[idx];
     y2=lines[idx+1];
   }
   const h=canvas?.height || det.height || 1;
   topPct=(Math.min(y1,y2)/h)*100;
   heightPct=(Math.abs(y2-y1)/h)*100;
 }else{
   heightPct=100/total;
   topPct = dir==='bottom-up'
     ? 100-(row*heightPct)
     : (row-1)*heightPct;
 }

 m.style.top=`${Math.max(0,Math.min(100-heightPct,topPct))}%`;
 m.style.height=`${Math.max(.35,heightPct)}%`;
 m.dataset.row=String(row);

 const label=document.getElementById('patternMarkerLabel');
 if(label) label.textContent=`${row}`;
}
function isLightGrid(r,g,b){

}
function findGridLines(canvas){
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 const w=canvas.width,h=canvas.height;
 if(w<50||h<50)return null;
 const sw=Math.max(1,Math.floor(w/1000));
 const sh=Math.max(1,Math.floor(h/1400));
 const data=ctx.getImageData(0,0,w,h).data;
 const scores=[];
 // Percentual de pixels cinza-claro em cada faixa horizontal.
 for(let y=0;y<h;y+=sh){
   let hit=0,samples=0;
   for(let x=Math.floor(w*.02);x<Math.floor(w*.98);x+=sw*2){
     const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2];
     const spread=Math.max(r,g,b)-Math.min(r,g,b);
     if(r>=175&&r<=252&&g>=175&&g<=252&&b>=175&&b<=252&&spread<18)hit++;
     samples++;
   }
   scores.push({y,score:samples?hit/samples:0});
 }
 // As linhas da grade atravessam quase toda a largura. Um limite alto evita
 // confundir detalhes cinza da imagem com linhas reais da grade.
 const threshold=Math.max(.60,percentile(scores.map(s=>s.score),78));
 const groups=[];
 for(const pt of scores){
   if(pt.score<threshold)continue;
   const last=groups[groups.length-1];
   if(last && pt.y-last[last.length-1].y<=Math.max(3,sh*2))last.push(pt);
   else groups.push([pt]);
 }
 let centers=groups
   .filter(g=>g.length<=Math.max(12,Math.ceil(12/sh)))
   .map(g=>g.reduce((best,p)=>p.score>best.score?p:best,g[0]).y)
   .sort((a,b)=>a-b);
 if(centers.length<4)return null;
 let gaps=[];
 for(let i=1;i<centers.length;i++){
   const d=centers[i]-centers[i-1];
   if(d>3)gaps.push(d);
 }
 if(!gaps.length)return null;
 // O espaçamento real aparece na maioria dos intervalos; saltos 2x/3x acontecem
 // quando o desenho preto cobre uma linha da grade.
 let base=percentile(gaps,45);
 const near=gaps.filter(d=>d>=base*.75&&d<=base*1.35);
 const pitch=near.length?(near.reduce((a,b)=>a+b,0)/near.length):base;
 if(!isFinite(pitch)||pitch<4)return null;
 let first=centers[0],last=centers[centers.length-1];
 // Bordas pretas do papel podem parecer uma linha extra. Removemos somente extremos
 // que não se encaixam na periodicidade da grade.
 function edgeFit(a,b){const n=(b-a)/pitch;return Math.abs(n-Math.round(n));}
 while(centers.length>4 && edgeFit(first,last)>.22){
   const dropLast=edgeFit(first,centers[centers.length-2]);
   const dropFirst=edgeFit(centers[1],last);
   if(dropLast<=dropFirst){centers.pop();last=centers[centers.length-1];}
   else {centers.shift();first=centers[0];}
 }
 const rows=Math.max(1,Math.round((last-first)/pitch));
 const confidence=Math.max(0,Math.min(1,centers.length/(rows+1)));
 return {lines:centers,pitch,rows,confidence,first,last};
}
function findGridColumns(canvas, expectedPitch = 0) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const w = canvas.width, h = canvas.height;
  if (w < 30 || h < 30) return null;
  const data = ctx.getImageData(0, 0, w, h).data;

  let pitch = Number(expectedPitch) || 0;
  const scores = new Array(w).fill(0);
  const yStep = Math.max(1, Math.floor(h / 600));

  for (let x = 1; x < w - 1; x++) {
    let contrastSum = 0, samples = 0;
    for (let y = 0; y < h; y += yStep) {
      const i = (y * w + x) * 4;
      const il = (y * w + (x - 1)) * 4;
      const ir = (y * w + (x + 1)) * 4;
      const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
      const lumL = (data[il] + data[il + 1] + data[il + 2]) / 3;
      const lumR = (data[ir] + data[ir + 1] + data[ir + 2]) / 3;
      contrastSum += Math.abs((lumL + lumR) / 2 - lum);
      samples++;
    }
    scores[x] = samples ? contrastSum / samples : 0;
  }

  if (!pitch || pitch < 4) {
    const raw = [];
    const threshold = percentile(scores, 85);
    for (let x = 1; x < w - 1; x++) if (scores[x] >= threshold) raw.push(x);
    const gaps = [];
    for (let i = 1; i < raw.length; i++) {
      const d = raw[i] - raw[i - 1];
      if (d >= 4) gaps.push(d);
    }
    pitch = gaps.length ? median(gaps) : 10;
  }

  let first = 0, last = w;
  for (let x = 0; x < w; x++) {
    if (scores[x] > 2) { first = x; break; }
  }
  for (let x = w - 1; x >= 0; x--) {
    if (scores[x] > 2) { last = x; break; }
  }

  if (last <= first) { first = 0; last = w; }

  // Bordas grossas podem deslocar a leitura 1–2 px. Se a linha detectada estiver
  // praticamente na extremidade da imagem, ancora na borda real para eliminar offset.
  if (first <= pitch * 0.25) first = 0;
  if ((w - last) <= pitch * 0.25) last = w;

  const columns = Math.max(1, Math.round((last - first) / pitch));
  const exactPitch = (last - first) / columns;

  const lines = [];
  for (let i = 0; i <= columns; i++) lines.push(first + i * exactPitch);

  return { lines, pitch: exactPitch, columns, confidence: 1, first, last };
}
function percentile(a,p){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p/100;const lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(i-lo)}

function normalizeProject(p){
  if(!p)return p;
  // Migração não destrutiva de concluídas antigas (array -> objeto colorido).
  if(Array.isArray(p.completedRows)){
    const migrated={};
    p.completedRows.forEach(item=>{
      const row=Number(typeof item==='object'?item.row:item);
      if(row>0)migrated[String(row)]=(typeof item==='object'&&item.color)||p.completedColor||'#2fb36f';
    });
    p.completedRows=migrated;
  } else if(!p.completedRows || typeof p.completedRows!=='object') p.completedRows={};
  if(typeof p.autoCompletePrevious==='boolean' && typeof p.autoMarkCompleted!=='boolean') p.autoMarkCompleted=p.autoCompletePrevious;
  if(typeof p.autoMarkCompleted!=='boolean')p.autoMarkCompleted=true;
  p.autoCompletePrevious=p.autoMarkCompleted;
  if(!p.completedColor)p.completedColor='#2fb36f';
  if(!p.currentRowColor)p.currentRowColor='#1877f2';
  if(!p.direction)p.direction='bottom-up';
  if(!Array.isArray(p.counters))p.counters=[];
  if(!Array.isArray(p.reminders))p.reminders=[];
  if(!Array.isArray(p.sections))p.sections=[];
  if(!Array.isArray(p.pointMarks))p.pointMarks=[];
  if(!p.pointColor)p.pointColor='#ff8a00';
  if(!Number.isFinite(Number(p.zoom)))p.zoom=1;
  p.zoom=Math.max(.25,Math.min(4,Number(p.zoom)||1));
  if(typeof p.centerPattern!=='boolean')p.centerPattern=false;
  if(!Number.isFinite(Number(p.activePoint))||Number(p.activePoint)<1)p.activePoint=1;
  if(!Number.isFinite(Number(p.detectedPoints))||Number(p.detectedPoints)<0)p.detectedPoints=0;
  if(!p.rowPointRanges||typeof p.rowPointRanges!=='object'||Array.isArray(p.rowPointRanges))p.rowPointRanges={};
  if(p.pointDirection!=='right-to-left'&&p.pointDirection!=='left-to-right')p.pointDirection='left-to-right';

  // V7.6.6: invalida SOMENTE geometria horizontal antiga.
  // Isso evita projetos salvos continuarem usando offsets/contagens das tentativas anteriores.
  if(Number(p.horizontalGridSchema)!==HGRID_SCHEMA){
    p.horizontalGridSchema=HGRID_SCHEMA;
    p.detectedPoints=0;
    p.gridLeft=null; p.gridRight=null; p.gridPitchX=null; p.gridSourceWidth=null;
    p.gridColumnLines=[]; p.foundX=null;
    p.rowPointRanges={};
    p.activePoint=1;
  }
  return p;
}

function getDisplayMetrics(p){const target=getPatternTarget();if(!target)return null;const sourceW=target.tagName==='CANVAS'?target.width:(target.naturalWidth||target.width);const sourceH=target.tagName==='CANVAS'?target.height:(target.naturalHeight||target.height);const displayW=target.getBoundingClientRect().width||target.clientWidth;const displayH=target.getBoundingClientRect().height||target.clientHeight;if(!sourceW||!sourceH||!displayW||!displayH)return null;return{target,sourceW,sourceH,displayW,displayH,sx:displayW/sourceW,sy:displayH/sourceH}}
function getRowGeometry(p,row){
 const m=getDisplayMetrics(p);if(!m)return null;
 const total=Math.max(1,Number(p.totalRows)||Number(p.detectedRows)||1);
 row=Math.max(1,Math.min(total,Number(row)||1));
 const dir=getDirection(p);
 const sourceH=Number(p.gridSourceHeight)||m.sourceH;
 const sy=m.displayH/sourceH;
 let gridTop=Number(p.gridTop),gridBottom=Number(p.gridBottom),pitch=Number(p.gridPitch);
 let topSource,heightSource;

 // Regra principal: uma carreira = exatamente UM passo da grade detectada.
 // Não usamos a altura total da imagem, pois margens/cortes fariam uma faixa ocupar
 // dois ou três quadradinhos. A carreira 1 é ancorada na borda REAL da grade.
 if(Number.isFinite(gridTop)&&Number.isFinite(gridBottom)&&gridBottom>gridTop&&Number.isFinite(pitch)&&pitch>0){
   const detectedTotal=Math.max(1,Number(p.gridDetectedRows||p.detectedRows)||Math.round((gridBottom-gridTop)/pitch));

   // Se o usuário não alterou o total, preserva o pitch detectado literalmente.
   // Em correção manual, redistribuímos somente dentro dos limites REAIS da grade.
   if(p.manualRowsOverride && total!==detectedTotal){
     pitch=(gridBottom-gridTop)/total;
   }
   heightSource=pitch;
   if(dir==='bottom-up'){
     // Carreira 1 = quadradinho imediatamente acima da última linha inferior da grade.
     topSource=gridBottom-row*pitch;
   }else{
     // Carreira 1 = quadradinho imediatamente abaixo da primeira linha superior da grade.
     topSource=gridTop+(row-1)*pitch;
   }

   // Limita à área detectada da grade, nunca às margens da imagem.
   topSource=Math.max(gridTop,Math.min(topSource,gridBottom-heightSource));
 }else{
   // Fallback somente quando ainda não há grade detectada.
   const fallbackPitch=sourceH/total;
   heightSource=fallbackPitch;
   topSource=dir==='bottom-up'?(sourceH-row*fallbackPitch):((row-1)*fallbackPitch);
 }

 const top=topSource*sy;
 const height=Math.max(1,heightSource*sy);
 return{top,height,width:m.displayW,sourceTop:topSource,sourceHeight:heightSource};
}

function getVisualRowIndex(p,row){

// Centralização horizontal V7.1: somente layout/scroll. Não toca na geometria lógica.
function applyHorizontalCenter(recenter=false){
  const p=project();
  const wrap=document.querySelector('.viewer-card .pattern-wrap');
  const stage=document.getElementById('patternStage');
  const btn=document.getElementById('centerPatternBtn');
  if(!p||!wrap||!stage)return;
  const active=!!p.centerPattern;
  wrap.classList.toggle('horizontal-centered',active);
  if(btn){
    btn.classList.toggle('active-tool',active);
    btn.textContent=active?'↔ Centralizado':'↔ Centralizar';
    btn.setAttribute('aria-pressed',active?'true':'false');
  }
  requestAnimationFrame(()=>{
    const target=getPatternTarget();
    if(!target)return;
    const targetWidth=target.getBoundingClientRect().width||target.clientWidth||0;
    // Quando cabe inteiro, o CSS com margens automáticas faz a centralização.
    // Não existe deslocamento lógico: target + overlays continuam no mesmo stage.
    if(active && targetWidth<=wrap.clientWidth+1){
      wrap.scrollLeft=0;
    }else if(active && recenter){
      // Quando é maior que a janela, mostra inicialmente o centro do gráfico,
      // mantendo o usuário livre para rolar horizontalmente depois.
      wrap.scrollLeft=Math.max(0,(wrap.scrollWidth-wrap.clientWidth)/2);
    }
    updateViewerOverlays();
  });
}

function isGridGrayPixel(data,w,x,y){
 x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.round(y));
 const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2],spread=Math.max(r,g,b)-Math.min(r,g,b);
 return r>=165&&r<=253&&g>=165&&g<=253&&b>=165&&b<=253&&spread<22;
}
function isDarkPatternPixel(data,w,x,y){
 x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.round(y));
 const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
 if(a<80)return false;
 // Preto/cinza escuro do desenho. O interior da célula é amostrado longe das linhas da grade.
 return r<115&&g<115&&b<115;
}
function cellHasUsefulContent(data,w,h,left,top,pitchX,pitchY){
 const x1=Math.max(0,Math.floor(left+pitchX*.16)),x2=Math.min(w-1,Math.ceil(left+pitchX*.84));
 const y1=Math.max(0,Math.floor(top+pitchY*.16)),y2=Math.min(h-1,Math.ceil(top+pitchY*.84));
 if(x2<x1||y2<y1)return false;
 const stepX=Math.max(1,Math.floor(pitchX/9)),stepY=Math.max(1,Math.floor(pitchY/9));
 let dark=0,samples=0;
 for(let y=y1;y<=y2;y+=stepY){
   for(let x=x1;x<=x2;x+=stepX){samples++;if(isDarkPatternPixel(data,w,x,y))dark++;}
 }
 // Uma célula preenchida/símbolo preto ocupa uma parcela relevante do interior.
 return samples>0 && dark/samples>=.10;
}
function detectPointRangesByRow(canvas, foundRows, foundX) {
  if (!foundRows || !foundX) return {};
  const rows = Math.max(1, Number(foundRows.rows) || 1);
  const total = Math.max(1, Math.round(Number(foundX.columns) || 1));
  const pitch = Number(foundX.pitch) || 0;
  const left = Number(foundX.first) || 0;
  const right = Number(foundX.last) || (left + total * pitch);
  const ranges = {};
  for (let visual = 1; visual <= rows; visual++) {
    ranges[String(visual)] = {
      left,
      right,
      pitch,
      total,
      firstCol: 0,
      lastCol: total - 1,
      gridBased: true
    };
  }
  return ranges;
}

function applyDetection(p,found,sourceH,foundX=null,sourceW=0,rowRanges=null){
 p.detectedRows=found.rows;
 p.gridDetectedRows=found.rows;
 p.gridTop=found.first;
 p.gridBottom=found.last;
 p.gridPitch=found.pitch;
 p.gridSourceHeight=sourceH;
 p.gridLines=Array.isArray(found.lines)?found.lines.slice():[];
 if(foundX){
   p.detectedPoints=foundX.columns;
   p.gridLeft=foundX.first;p.gridRight=foundX.last;p.gridPitchX=foundX.pitch;
   p.gridSourceWidth=sourceW;p.gridColumnLines=Array.isArray(foundX.lines)?foundX.lines.slice():[];
   p.foundX={first:foundX.first,last:foundX.last,pitch:foundX.pitch,columns:foundX.columns,lines:Array.isArray(foundX.lines)?foundX.lines.slice():[]};
   p.horizontalGridSchema=HGRID_SCHEMA;
   p.rowPointRanges=rowRanges&&typeof rowRanges==='object'?rowRanges:{};
   p.activePoint=1;clampActivePoint(p);
 }
 p.totalRows=found.rows;
 p.manualRowsOverride=false;
 if(p.row>p.totalRows)p.row=p.totalRows;
 const c=(p.counters||[]).find(x=>x.name==='Carreiras');if(c)c.target=found.rows;
 save();
}
function makeMobileSafeDetectionCanvas(source){
  if(!source)throw new Error('Fonte do gráfico não encontrada');
  const sourceW=source.tagName==='IMG'?(source.naturalWidth||source.width):(source.width||0);
  const sourceH=source.tagName==='IMG'?(source.naturalHeight||source.height):(source.height||0);
  if(!sourceW||!sourceH)throw new Error('Gráfico sem dimensões válidas');

  // Em celulares, getImageData em imagens muito grandes pode falhar por memória.
  // A análise usa uma cópia reduzida e depois converte as coordenadas para
  // o tamanho original. Isso NÃO muda a imagem nem a geometria salva.
  const maxSide=3000;
  const maxPixels=5000000;
  const bySide=Math.min(1,maxSide/Math.max(sourceW,sourceH));
  const byPixels=Math.min(1,Math.sqrt(maxPixels/(sourceW*sourceH)));
  const scale=Math.min(bySide,byPixels);

  if(scale>=0.999 && source.tagName==='CANVAS'){
    return {canvas:source,scale:1,sourceW,sourceH};
  }

  const canvas=document.createElement('canvas');
  canvas.width=Math.max(30,Math.round(sourceW*scale));
  canvas.height=Math.max(30,Math.round(sourceH*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx)throw new Error('Canvas de detecção indisponível');
  ctx.drawImage(source,0,0,canvas.width,canvas.height);
  return {canvas,scale,sourceW,sourceH};
}

function scaleDetectedGrid(det,factor){
  if(!det||factor===1)return det;
  const out={...det};
  ['pitch','first','last'].forEach(k=>{if(Number.isFinite(Number(out[k])))out[k]=Number(out[k])*factor});
  if(Array.isArray(out.lines))out.lines=out.lines.map(v=>Number(v)*factor);
  return out;
}

function scaleDetectedRowRanges(ranges,factor){
  if(!ranges||factor===1)return ranges||{};
  const out={};
  Object.keys(ranges).forEach(k=>{
    const r={...ranges[k]};
    ['left','right','pitch'].forEach(n=>{if(Number.isFinite(Number(r[n])))r[n]=Number(r[n])*factor});
    out[k]=r;
  });
  return out;
}

async function detectPatternRows(){
 const p=project();if(!p?.pattern){toast('Adicione uma receita primeiro.');return}
 try{
   let source;
   if(isPdfPattern(p)){
     await renderPdfPage(pdfPageCache[p.id]?.page||1);
     source=document.getElementById('pdfCanvas');
   }else{
     const img=document.getElementById('patternImg');
     if(!img)throw new Error('Imagem não encontrada');
     if(!img.complete || !img.naturalWidth)await new Promise((res,rej)=>{
       const done=()=>{cleanup();res()};
       const fail=()=>{cleanup();rej(new Error('Não foi possível carregar a imagem'))};
       const cleanup=()=>{img.removeEventListener('load',done);img.removeEventListener('error',fail)};
       img.addEventListener('load',done,{once:true});
       img.addEventListener('error',fail,{once:true});
       if(img.complete&&img.naturalWidth)done();
     });
     source=img;
   }
   if(!source)throw new Error('Imagem/canvas não encontrado');

   const prep=makeMobileSafeDetectionCanvas(source);
   const canvas=prep.canvas;
   const foundScaled=findGridLines(canvas);
   if(!foundScaled)throw new Error('Grade horizontal não identificada');

   const foundXScaled=findGridColumns(canvas,foundScaled.pitch);
   const rowRangesScaled=foundXScaled?detectPointRangesByRow(canvas,foundScaled,foundXScaled):{};

   const factor=prep.scale>0?1/prep.scale:1;
   const found=scaleDetectedGrid(foundScaled,factor);
   const foundX=scaleDetectedGrid(foundXScaled,factor);
   const rowRanges=scaleDetectedRowRanges(rowRangesScaled,factor);

   applyDetection(p,found,prep.sourceH,foundX,prep.sourceW,rowRanges);
   if((Number(p.row)||0)<1 && found.rows>0)p.row=1;
   p.activePoint=1;
   save();
   rerenderPreserveViewer();

   toast(foundX
     ? `✅ ${found.rows} carreiras e ${foundX.columns} pontos detectados`
     : `✅ ${found.rows} carreiras detectadas; pontos horizontais não identificados`);
 }catch(e){
   console.error('Falha na detecção:',e);
   const msg=(e&&e.message)?e.message:'erro desconhecido';
   toast('Falha na detecção: '+msg);
 }
}
async function detectPdfRows(){return detectPatternRows()}

io da contagem</div><div class="direction-grid"><button class="btn ${getPointDirection(p)==='left-to-right'?'':'secondary'}" onclick="setPointDirection('left-to-right')">Esquerda → direita</button><button class="btn ${getPointDirection(p)==='right-to-left'?'':'secondary'}" onclick="setPointDirection('right-to-left')">Direita → esquerda</button></div></div><div class="compact-card"><h3>Marcações</h3><button id="completeCurrentBtn" class="btn ${isDone?'secondary':''} mark-action" onclick="toggleCompletedRow(${p.row||1})">${isDone?'↩ Reabrir atual':'✓ Concluir atual'}</button><button class="btn secondary mark-action" onclick="markThroughCurrent()">✓ Marcar até a atual</button><div class="switch-row" style="margin-top:10px"><input id="autoMark" type="checkbox" ${p.autoMarkCompleted?'checked':''} onchange="setAutoMarkCompleted(this.checked)"><label for="autoMark" style="margin:0;color:inherit">Ao avançar, concluir a anterior</label></div><div class="color-row" style="margin-top:10px"><div><div class="small">Cor das próximas concluídas</div><span class="completed-chip"><span class="dot" style="background:${p.completedColor}"></span><span id="completedCountChip">${completedCount(p)} concluídas</span></span></div><input type="color" value="${p.completedColor}" onchange="setCompletedColor(this.value)"></div><div class="row" style="margin-top:8px"><button class="btn secondary" style="flex:1;padding:8px" onclick="recolorCompleted()">Aplicar a todas</button><button class="btn ghost" style="padding:8px" onclick="clearCompleted()">Limpar</button></div></div><div class="compact-card"><h3>Sentido</h3><div class="direction-grid"><button class="btn ${getDirection(p)==='bottom-up'?'':'secondary'}" onclick="setDirection('bottom-up')">⬆ Baixo → cima</button><button class="btn ${getDirection(p)==='top-down'?'':'secondary'}" onclick="setDirection('top-down')">⬇ Cima → baixo</button></div></div><div class="compact-card"><h3>Progresso</h3><div class="progress"><div data-progress-fill style= nger" onclick="removePattern()">Remover</button>':''}</div></div>${renderPattern(p)}<div class="viewer-footer"><div class="detect-inline"><strong style="font-size:12px">Detecção:</strong><span class="small">${p.detectedRows?'✅ '+p.detectedRows+' carreiras'+(p.detectedPoints?' · pontos por carreira analisados':''):'não realizada'}</span>${p.pattern?`<button class="btn" onclick="detectPatternRows()">🔎 ${p.detectedRows?'Detectar novamente':'Detectar carreiras'}</button>`:''}<div class="detect-manual-fields"><label><span>Carreiras</span><input class="detect-number" type="number" min="1" value="${p.totalRows||p.detectedRows||''}" placeholder="Total" onchange="setDetectedRows(this.value)"></label><label><span>Pontos / largura</span><input class="detect-number" type="number" min="1" value="${p.detectedPoints||''}" placeholder="Largura" title="Largura horizontal global de referência; cada carreira usa sua própria faixa quando detectada" onchange="setDetectedPoints(this.value)"></label></div></div><div class="completed-chip"><span class="dot" style="background:${p.currentRowColor}"></span>Atual <span class="dot" style="background:${p.completedColor};margin-left:8px"></span>Concluídas</div></div></section><div class="extra-tools"><details><summary>Mais ferramentas do projeto</summary><div class="extra-grid"><div class="compact-card"><h3>⏱ Tempo</h3><div id="liveTime" style="font-size:24px;font-weight:800">${formatTime(p.seconds)}</div><div class="row" style="margin-top:8px">${p.running?'<button class="btn" onclick="pauseTimer()">⏸ Pausar</button>':'<button class="btn" onclick="startTimer()">▶ Iniciar</button>'}<button class="btn secondary" onclick="resetTimer()">Zerar</button></div></div><div class="compact-card"><h3>📝 Anotações</h3><textarea oninput="updateNotes(this.value)">${esc(p.notes)}</textarea></div><div class="compact-card"><h3>▦ Métricas da grade</h3><div class="small">Total estimado de quadrados/pontos do projeto</div><div id="graphAreaTotal" style="font-size:24px;font-weight:800;margin-top:4px">${getProjectPointTotal(p).toLocaleString('pt-BR')}</div><div class="small" style="margin-top:5px">Soma das larguras detectadas carreira por carreira.</div></div><div class="compact-card"><h3>⚙ Projeto</h3><button class="btn secondary" onclick="exportProject()">Exportar</button> <button class="btn danger" onclick="deleteProject()">Excluir</button></div></div></details></div></div>`;if(p.running){clearInterval(timerHandle);timerHandle=setInterval(()=>{addTime(p);updateLive()},1000)}if(isPdfPattern(p))renderPdfPage(pdfPageCache[p.id]?.page||1).then(()=>{applyZoom();setTimeout(()=>applyHorizontalCenter(!!p.centerPattern),0)});else setTimeout(()=>{applyZoom();applyHorizontalCenter(!!p.centerPattern)},20)}

// Reaplica zoom/overlays após PDF renderizar.
const _renderPdfPageV62=renderPdfPage;
renderPdfPage=async function(pageNo=1){const result=await _renderPdfPageV62(pageNo);const p=project();if(p?.pattern)setTimeout(applyZoom,0);return result}
window.addEventListener('resize',()=>setTimeout(updateViewerOverlays,50));


// V7.3: Shift + setas navega pelos pontos da carreira atual sem alterar atalhos verticais.
document.addEventListener('keydown',e=>{
 const tag=(e.target?.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||e.target?.isContentEditable)return;
 if(document.getElementById('page-work')?.classList.contains('hidden'))return;
 if(e.shiftKey&&e.key==='ArrowRight'){e.preventDefault();e.stopImmediatePropagation();changePoint(1)}
 else if(e.shiftKey&&e.key==='ArrowLeft'){e.preventDefault();e.stopImmediatePropagation();changePoint(-1)}
},true);



/* ================= V7.5 — ARQUITETURA VISUAL COM RÉGUAS EXTERNAS ================= */
function renderPattern(p){
 if(!p.pattern)return `<div class="empty">Nenhum padrão adicionado.<br><small>Você pode colocar uma imagem ou PDF da receita aqui.</small></div>`;
 const overlays=`<div class="completed-rows-layer" id="completedRowsLayer"></div><div class="row-highlight" id="rowHighlight"></div><div class="point-marks-layer" id="pointMarksLayer"></div><div class="point-active-layer" id="pointActiveLayer"><div class="point-active-cell" id="pointActiveCell"></div></div>`;
 const externalStart=`<div class="pattern-shell-v75" id="patternShell"><div class="row-ruler-external-v75" id="rowRulerLayer" aria-label="Régua de carreiras"></div>`;
 const externalEnd=`<div class="point-ruler-external-v75" id="pointRulerLayer" aria-label="Régua de pontos"></div></div>`;
 if(isPdfPattern(p)){
   return `<div class="pattern-wrap" id="pdfPatternWrap">${externalStart}<div class="pattern-stage" id="patternStage" onclick="onPatternPointClick(event)"><canvas id="pdfCanvas"></canvas>${overlays}</div>${externalEnd}</div></div><div class="row" style="margin-top:10px;justify-content:center"><button id="pdfPrevBtn" class="btn secondary" onclick="pdfPrevPage()">◀ Página anterior</button><span id="pdfPageInfo" class="small">Página 1</span><button id="pdfNextBtn" class="btn secondary" onclick="pdfNextPage()">Próxima página ▶</button></div>`;
 }
 return `<div class="pattern-wrap">${externalStart}<div class="pattern-stage" id="patternStage" onclick="onPatternPointClick(event)"><img id="patternImg" src="${p.pattern.data}" alt="Padrão" onload="onPatternLoadedV75()">${overlays}</div>${externalEnd}</div></div>`;
}

function onPatternLoadedV75(){
 applyZoom();
 requestAnimationFrame(()=>{updateViewerOverlays();applyHorizontalCenter(false)});
}

/* V7.5 não altera a origem/matriz de pontos da V7.4.
   A régua externa consome getPointGeometry() exatamente como o marcador ativo. */
function renderPointRuler(){
 const p=project(),layer=document.getElementById('pointRulerLayer'),m=p&&getDisplayMetrics(p);
 if(!p||!layer||!m)return;
 const row=Number(p.row)||0,total=getCurrentRowPointTotal(p);
 layer.innerHTML='';
 layer.style.top=m.displayH+'px';layer.style.width=m.displayW+'px';
 if(row<1||!total){layer.style.display='none';return}
 layer.style.display='block';const active=clampActivePoint(p);
 for(let point=1;point<=total;point++){
   const g=getPointGeometry(p,point,row);if(!g)continue;
   const cell=document.createElement('div');cell.className='point-ruler-cell'+(point===active?' active':'');
   cell.textContent=point===1?'P1':String(point);cell.style.left=g.left+'px';cell.style.width=g.width+'px';cell.title=`Ponto ${point} de ${total}`;
   layer.appendChild(cell);
 }
}

function renderRowRuler(){
 const p=project(),layer=document.getElementById('rowRulerLayer'),m=p&&getDisplayMetrics(p);if(!p||!layer||!m)return;
 const total=Math.max(0,Number(p.totalRows)||Number(p.detectedRows)||0),active=Math.max(0,Number(p.row)||0);
 layer.innerHTML='';layer.style.height=m.displayH+'px';if(!total){layer.style.display='none';return}layer.style.display='block';
 const probe=getRowGeometry(p,Math.max(1,active||1)),rowPx=Math.max(1,probe?.height||1),labelStep=Math.max(1,Math.ceil(16/rowPx));
 for(let row=1;row<=total;row++){
   const g=getRowGeometry(p,row);if(!g)continue;const cell=document.createElement('div');cell.className='row-ruler-cell-v75'+(row===active?' active':'');
   cell.style.top=g.top+'px';cell.style.height=g.height+'px';
   if(row===active||row===1||row===total||((row-1)%labelStep===0))cell.textContent=String(row);
   cell.title='Carreira '+row;layer.appendChild(cell);
 }
}

function positionActivePoint(){
 const p=project(),cell=document.getElementById('pointActiveCell');if(!p||!cell)return;
 const row=Number(p.row)||0;if(row<1){cell.style.display='none';return}
 const rg=getRowGeometry(p,row),pg=getPointGeometry(p,clampActivePoint(p),row);if(!rg||!pg){cell.style.display='none';return}
 Object.assign(cell.style,{display:'block',left:pg.left+'px',top:rg.top+'px',width:pg.width+'px',height:rg.height+'px'});
}

function syncOverlaySize(){
 const p=project(),m=p&&getDisplayMetrics(p);if(!m)return;
 ['completedRowsLayer','rowHighlight','pointMarksLayer','pointActiveLayer'].forEach(id=>{const e=document.getElementById(id);if(e){e.style.width=m.displayW+'px';e.style.height=m.displayH+'px'}});
 const ruler=document.getElementById('pointRulerLayer');if(ruler){ruler.style.top=m.displayH+'px';ruler.style.width=m.displayW+'px'}
 const rr=document.getElementById('rowRulerLayer');if(rr)rr.style.height=m.displayH+'px';
}

function updateViewerOverlays(){syncOverlaySize();renderCompletedRows();positionRowHighlight();renderPointMarks();positionActivePoint();renderPointRuler();renderRowRuler();refreshPointCounter()}

/* Marcação de concluídas continua transparente, mas sem números dentro da imagem. */
function renderCompletedRows(){
 const p=project(),layer=document.getElementById('completedRowsLayer');if(!p||!layer)return;layer.innerHTML='';
 Object.keys(p.completedRows).map(Number).filter(r=>r>=1).sort((a,b)=>a-b).forEach(r=>{const g=getRowGeometry(p,r);if(!g)return;const color=p.completedRows[String(r)]||p.completedColor,band=document.createElement('div');band.className='completed-row-band';Object.assign(band.style,{top:g.top+'px',height:g.height+'px',width:g.width+'px',right:'auto',background:hexToRgba(color,.18)});layer.appendChild(band)});
}

function positionRowHighlight(){
 const p=project(),band=document.getElementById('rowHighlight');if(!p||!band)return;
 const total=Math.max(0,Number(p.totalRows)||Number(p.detectedRows)||0),row=Math.max(0,Math.min(total||Infinity,Number(p.row)||0));
 if(!total||row<1){band.style.display='none';renderCompletedRows();renderRowRuler();return}
 const g=getRowGeometry(p,row);if(!g){band.style.display='none';return}
 Object.assign(band.style,{top:g.top+'px',height:g.height+'px',width:g.width+'px',right:'auto',display:'block',background:hexToRgba(p.currentRowColor,.14),borderColor:p.currentRowColor});
 renderCompletedRows();renderPointMarks();renderRowRuler();
}

function applyHorizontalCenter(recenter=false){
 const p=project(),wrap=document.querySelector('.viewer-card .pattern-wrap'),shell=document.getElementById('patternShell'),btn=document.getElementById('centerPatternBtn');if(!p||!wrap||!shell)return;
 const active=!!p.centerPattern;wrap.classList.toggle('horizontal-centered',active);
 if(btn){btn.classList.toggle('active-tool',active);btn.textContent=active?'↔ Centralizado':'↔ Centralizar';btn.setAttribute('aria-pressed',active?'true':'false')}
 requestAnimationFrame(()=>{if(active&&shell.getBoundingClientRect().width<=wrap.clientWidth+1){wrap.scrollLeft=0}else if(active&&recenter){wrap.scrollLeft=Math.max(0,(wrap.scrollWidth-wrap.clientWidth)/2)}updateViewerOverlays()});
}

function fitZoom(){
 const p=project(),target=getPatternTarget(),wrap=document.querySelector('.viewer-card .pattern-wrap');if(!p||!target||!wrap)return;
 const naturalW=target.tagName==='CANVAS'?target.width:(target.naturalWidth||target.width);if(!naturalW)return;
 setZoom(Math.max(.25,Math.min(4,(wrap.clientWidth-58)/naturalW)));
}

/* Garante atualização das réguas externas também após cada renderização de PDF. */
const _renderPdfPageV75=renderPdfPage;
renderPdfPage=async function(pageNo=1){const result=await _renderPdfPageV75(pageNo);requestAnimationFrame(()=>{applyZoom();updateViewerOverlays();applyHorizontalCenter(false)});return result};

/* V7.6 — pontos por carreira com extremos úteis + direção independente esquerda/direita. */
window.addEventListener('beforeunload',()=>{const p=project();if(p&&p.running){addTime(p);p.running=false;save()}});
renderProjects();
applySidebarState();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(reg => reg.update())
      .catch(err => console.warn('SW:', err));
  });
}

<script>
(function(){
  function isMobileCrochet(){ return window.matchMedia('(max-width:760px)').matches; }

  window.toggleMobileBottomNav=function(){
    const hidden=!document.body.classList.contains('mobile-nav-hidden');
    document.body.classList.toggle('mobile-nav-hidden',hidden);
    try{localStorage.setItem('meuCroche_mobileNavHidden',hidden?'1':'0')}catch(e){}
    syncMobileNavToggle();
    setTimeout(()=>{ if(typeof updateViewerOverlays==='function') updateViewerOverlays(); },260);
  };

  function syncMobileNavToggle(){
    const b=document.getElementById('mobileNavToggle');
    if(!b)return;
    const hidden=document.body.classList.contains('mobile-nav-hidden');
    b.textContent=hidden?'⌃':'⌄';
    b.title=hidden?'Mostrar menu inferior':'Recolher menu inferior';
    b.setAttribute('aria-label',b.title);
  }

  function getMobileRowText(){
    const p=typeof project==='function'?project():null;
    if(!p)return {row:0,total:0};
    return {row:Number(p.row)||0,total:Number(p.totalRows||p.detectedRows)||0};
  }

  function getMobilePointText(){
    const p=typeof project==='function'?project():null;
    if(!p)return {point:0,total:0};
    let total=0,point=0;
    try{
      total=typeof getCurrentRowPointTotal==='function'?Number(getCurrentRowPointTotal(p))||0:0;
      point=total && typeof clampActivePoint==='function'?Number(clampActivePoint(p))||1:0;
    }catch(e){}
    return {point,total};
  }

  window.refreshCrochetMobileControls=function(){
    if(!isMobileCrochet())return;
    const row=getMobileRowText(),pt=getMobilePointText();
    const rowEl=document.getElementById('mobileCrochetRow');
    const ptEl=document.getElementById('mobileCrochetPoint');
    const center=document.getElementById('mobileCrochetRowCenter');
    if(rowEl) rowEl.textContent=row.total?`${row.row} de ${row.total}`:String(row.row||0);
    if(ptEl) ptEl.textContent=pt.total?`${pt.point} de ${pt.total}`:'não detectado';
    if(center) center.innerHTML=`<strong>${row.row||0}</strong>${row.total?'de '+row.total:'carreira'}`;
  };

  window.ensureCrochetMobileControls=function(){
    if(!isMobileCrochet())return;
    const viewer=document.getElementById('viewerPanel');
    if(!viewer)return;

    const footer=viewer.querySelector('.viewer-footer');
    if(!footer)return;

    let controls=document.getElementById('crochetMobileControls');
    if(!controls){
      controls=document.createElement('div');
      controls.id='crochetMobileControls';
      controls.className='crochet-mobile-controls';
      controls.innerHTML=`
        <div class="crochet-status">
          <div class="crochet-status-box"><span>Carreira</span><strong id="mobileCrochetRow">0</strong></div>
          <div class="crochet-status-box"><span>Ponto</span><strong id="mobileCrochetPoint">não detectado</strong></div>
        </div>
        <div class="crochet-point-nav">
          <button class="btn crochet-point-prev" type="button" onclick="changePoint(-1)">← <strong>Anterior</strong><small>ponto</small></button>
          <button class="btn crochet-point-next" type="button" onclick="changePoint(1)"><strong>Próximo ponto</strong>→</button>
        </div>
        <div class="crochet-row-nav">
          <button class="btn secondary" type="button" onclick="changeRow(-1)">↑ Carreira anterior</button>
          <div class="crochet-row-current" id="mobileCrochetRowCenter"><strong>0</strong>carreira</div>
          <button class="btn secondary" type="button" onclick="changeRow(1)">Carreira próxima ↓</button>
        </div>`;
      viewer.insertBefore(controls,footer);
    }

    if(!document.getElementById('mobileNavToggle')){
      const toggle=document.createElement('button');
      toggle.id='mobileNavToggle';
      toggle.className='mobile-nav-toggle';
      toggle.type='button';
      toggle.onclick=toggleMobileBottomNav;
      document.body.appendChild(toggle);
    }
    syncMobileNavToggle();
    refreshCrochetMobileControls();
  };

  try{
    if(localStorage.getItem('meuCroche_mobileNavHidden')==='1'){
      document.body.classList.add('mobile-nav-hidden');
    }
  }catch(e){}

  if(typeof renderWork==='function'){
    const _renderWorkCrochetFocus=renderWork;
    renderWork=function(){
      const r=_renderWorkCrochetFocus.apply(this,arguments);
      setTimeout(()=>{ensureCrochetMobileControls();refreshCrochetMobileControls();},0);
      return r;
    };
  }

  if(typeof refreshPointCounter==='function'){
    const _refreshPointCounterCrochetFocus=refreshPointCounter;
    refreshPointCounter=function(){
      const r=_refreshPointCounterCrochetFocus.apply(this,arguments);
      refreshCrochetMobileControls();
      return r;
    };
  }

  window.addEventListener('resize',()=>{
    if(isMobileCrochet())ensureCrochetMobileControls();
  });
  window.addEventListener('load',()=>{
    syncMobileNavToggle();
    setTimeout(ensureCrochetMobileControls,100);
  });
})();
</script>
